name: CI

on:
  pull_request:
  push:
    branches:
      - seismic
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: faucet-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Detect Rust workspace
        id: workspace
        shell: bash
        run: |
          if [[ -f Cargo.toml ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust
        if: steps.workspace.outputs.exists == 'true'
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        if: steps.workspace.outputs.exists == 'true'
        uses: Swatinem/rust-cache@v2

      - name: Install Redis
        if: steps.workspace.outputs.exists == 'true'
        run: sudo apt-get update && sudo apt-get install --yes redis-server

      - name: Check formatting
        if: steps.workspace.outputs.exists == 'true'
        run: cargo fmt --all -- --check

      - name: Lint
        if: steps.workspace.outputs.exists == 'true'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        if: steps.workspace.outputs.exists == 'true'
        run: cargo test --workspace --locked

      - name: Build production binaries
        if: steps.workspace.outputs.exists == 'true'
        run: cargo build --workspace --release --locked

  frontend:
    name: ${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        app:
          - frontend
          - community-frontend
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.20

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.20

      - name: Install Seismic Foundry
        shell: bash
        run: |
          mkdir -p "$HOME/.seismic/bin" "$HOME/.config/.seismic/bin"
          curl --proto '=https' --tlsv1.2 -fsSL \
            https://raw.githubusercontent.com/SeismicSystems/seismic-foundry/5048ad8a85892a5abd6eec138a1c40543bbed33a/foundryup/foundryup \
            -o "$HOME/.seismic/bin/sfoundryup"
          chmod +x "$HOME/.seismic/bin/sfoundryup"
          echo "$HOME/.seismic/bin" >> "$GITHUB_PATH"
          echo "$HOME/.config/.seismic/bin" >> "$GITHUB_PATH"
          "$HOME/.seismic/bin/sfoundryup" --install v0.3.0

      - name: Install Solidity dependencies
        working-directory: contracts
        run: sforge soldeer install --config-location foundry

      - name: Check formatting
        working-directory: contracts
        run: sforge fmt --check

      - name: Build contracts
        working-directory: contracts
        run: sforge build

      - name: Check contract ABIs
        run: bun run scripts/check-contract-abi.ts

      - name: Test contracts
        working-directory: contracts
        run: sforge test
