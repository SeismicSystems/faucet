server {
    server_name faucet.seismictest.net;
    listen 80;

    return 301 https://$host$request_uri;
}

server {
    server_name faucet.seismictest.net;
    listen 443 ssl;

    ssl_certificate /etc/letsencrypt/live/faucet.seismictest.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/faucet.seismictest.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location /api/internal/ {
        allow __ORCHESTRATION_STAGING_EGRESS_IP__;
        deny all;
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Exceeds the service's 45s hard deadline; callers must allow more than 50s.
        proxy_read_timeout 50s;
        proxy_connect_timeout 5s;
    }

    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Longer timeouts for API operations
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}

server {
    server_name community-faucet.seismictest.net;
    listen 80;

    location / {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Longer timeouts for API operations
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}
