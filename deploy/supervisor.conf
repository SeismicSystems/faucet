[program:redis]
command=/usr/bin/redis-server /home/ubuntu/faucet/deploy/redis.conf
directory=/home/ubuntu/faucet
user=ubuntu
autostart=true
autorestart=true
startsecs=5
startretries=3
priority=1
stderr_logfile=/var/log/faucet/redis.err.log
stdout_logfile=/var/log/faucet/redis.out.log
redirect_stderr=true
stopasgroup=true
killasgroup=true

[program:faucet-frontend]
command=/home/ubuntu/.bun/bin/bun start
directory=/home/ubuntu/faucet/frontend
user=ubuntu
autostart=true
autorestart=true
startsecs=10
startretries=3
stderr_logfile=/var/log/faucet/frontend.err.log
stdout_logfile=/var/log/faucet/frontend.out.log
environment=NODE_ENV=production,NODE_OPTIONS="--max-old-space-size=2048",PATH="/home/ubuntu/.bun/bin:/usr/local/bin:/usr/bin:/bin"
stopasgroup=true
killasgroup=true
redirect_stderr=true

[program:faucet-machine-funding]
command=/bin/bash -lc 'set -a && source /home/ubuntu/faucet/.env.machine-funding && exec /home/ubuntu/faucet/target/release/faucet-machine-funding'
directory=/home/ubuntu/faucet
user=ubuntu
autostart=true
autorestart=true
startsecs=10
startretries=3
priority=2
stderr_logfile=/var/log/faucet/machine-funding.err.log
stdout_logfile=/var/log/faucet/machine-funding.out.log
environment=RUST_LOG="faucet_machine_funding=info"
stopasgroup=true
killasgroup=true
redirect_stderr=true

[program:faucet-discord-frontend]
command=/home/ubuntu/.bun/bin/bun start
directory=/home/ubuntu/faucet/community-frontend
user=ubuntu
autostart=true
autorestart=true
startsecs=10
startretries=3
stderr_logfile=/var/log/faucet/discord-frontend.err.log
stdout_logfile=/var/log/faucet/discord-frontend.out.log
environment=NODE_ENV=production,NODE_OPTIONS="--max-old-space-size=2048",PATH="/home/ubuntu/.bun/bin:/usr/local/bin:/usr/bin:/bin"
stopasgroup=true
killasgroup=true
redirect_stderr=true
